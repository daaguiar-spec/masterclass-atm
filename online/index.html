<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: chat em tela única sobre um "céu noturno" com estrelas douradas; capa do evento abre a conversa; oferta como ingresso */
:root{
  --night:#0B0A1F; --night2:#1B1446; --glass:rgba(255,255,255,.07); --glass-line:rgba(255,255,255,.12);
  --ink:#F3EFFF; --muted:#A9A3C9; --gold:#E9C46A; --gold2:#C8952F; --lilac:#B9A8FF; --me1:#F2D27E; --me2:#D9A441; --me-ink:#22183F;
  --display:"Fraunces", Georgia, serif; --body:"Figtree", system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:15px}
.app{position:relative;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(120% 60% at 50% -10%,#3A2A8C 0%,var(--night2) 38%,var(--night) 75%)}
#sky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.app>*:not(#sky){position:relative;z-index:1}

header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(11,10,31,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--glass-line)}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 2px var(--night),0 0 0 3.5px var(--gold),0 0 18px rgba(233,196,106,.45)}
.who{min-width:0;flex:1}
.who b{display:flex;align-items:center;gap:5px;font-family:var(--display);font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden}
.who b .n{overflow:hidden;text-overflow:ellipsis}
.who b svg{flex:none}
.who>span{font-size:12px;color:var(--muted);white-space:nowrap}
.who>span.on::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#3DDC84;margin-right:6px;vertical-align:1px;box-shadow:0 0 8px #3DDC84}
.vaga{flex:none;font:700 12px var(--body);color:var(--me-ink);background:linear-gradient(135deg,var(--me1),var(--me2));border:0;border-radius:999px;padding:7px 10px;cursor:pointer;box-shadow:0 4px 16px rgba(217,164,65,.35)}

#log>*{flex-shrink:0}
#log{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 10px;display:flex;flex-direction:column;gap:8px}
.day{align-self:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--glass);padding:4px 10px;border-radius:8px}

/* capa do evento */
.cover{border-radius:18px;overflow:hidden;border:1px solid rgba(233,196,106,.35);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));box-shadow:0 18px 40px rgba(0,0,0,.35);animation:rise .6s ease-out}
.cover .ph{position:relative;aspect-ratio:16/10;max-width:100%;background:url(../daniel.jpg) 30% 22%/cover no-repeat}
.cover .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,10,31,0) 35%,rgba(11,10,31,.92) 100%)}
.cover .ed{position:absolute;top:12px;left:12px;z-index:1;font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--me-ink);background:var(--gold);padding:5px 9px;border-radius:6px}
.cover .live{position:absolute;top:12px;right:12px;z-index:1;font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:rgba(220,38,38,.9);padding:5px 9px;border-radius:6px}
.cover .live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;margin-right:6px;vertical-align:1px;animation:blink 1.4s infinite}
.cover .capa{display:block;width:100%;max-width:100%;height:auto;aspect-ratio:900/658}
.cover .tx{padding:10px 10px 12px}
.cover h1{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(28px,8vw,36px);line-height:1.02;text-wrap:balance;
  background:linear-gradient(100deg,#FFF6DA 0%,var(--gold) 45%,#FFF6DA 60%,var(--gold2) 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s ease-in-out infinite}
.cover p{margin:6px 0 12px;color:var(--muted);font-size:14px}
.cover p strong{color:var(--ink);font-weight:600}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.facts div{background:var(--glass);border:1px solid var(--glass-line);border-radius:10px;padding:7px 4px;text-align:center}
.facts b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.facts span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* mensagens */
.msg{max-width:86%;padding:9px 12px 6px;border-radius:14px;line-height:1.45;animation:pop .25s ease-out;overflow-wrap:anywhere}
.msg.bot{align-self:flex-start;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-top-left-radius:4px}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--me1),var(--me2));color:var(--me-ink);border-top-right-radius:4px;box-shadow:0 6px 18px rgba(217,164,65,.25)}
.msg time{display:block;text-align:right;font-size:10.5px;color:var(--muted);margin-top:2px}
.msg.me time{color:rgba(34,24,63,.6)}
.msg ul{margin:6px 0 2px;padding-left:18px}
.msg li{margin:3px 0}
.msg li::marker{color:var(--gold)}
.msg strong{font-weight:600;color:#fff}
.msg.me strong{color:inherit}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 2px}
.stats div{border:1px solid var(--glass-line);background:rgba(255,255,255,.04);border-radius:10px;padding:8px 10px}
.stats b{display:block;font-family:var(--display);font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.1}
.stats span{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}

/* oferta em formato de ingresso */
.msg.ticket{padding:0;max-width:92%;background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none}
.tk{position:relative;border-radius:16px;background:linear-gradient(160deg,#2B2066,#171238);border:1px solid rgba(233,196,106,.55);box-shadow:0 14px 34px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.04)}
.tk .top{padding:14px 16px 12px}
.tk .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.tk .nm{font-family:var(--display);font-size:19px;font-weight:600;margin:4px 0 2px;line-height:1.2}
.tk .when{font-size:13px;color:var(--muted)}
.tk .cut{position:relative;height:0;border-top:2px dashed rgba(233,196,106,.35);margin:0 14px}
.tk .cut::before,.tk .cut::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--night)}
.tk .cut::before{left:-25px}.tk .cut::after{right:-25px}
.tk .bot{padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px}
.tk .price{display:flex;align-items:baseline;gap:8px}
.tk .price b{font-family:var(--display);font-size:34px;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.tk .price span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.tk ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14px}
.tk li::before{content:"✦";color:var(--gold);margin-right:8px}
.tk time{padding:0 16px 8px;margin:0}

.cta{display:block;margin-top:8px;text-align:center;background:linear-gradient(135deg,var(--me1),var(--me2));color:var(--me-ink);text-decoration:none;border:0;width:100%;
  font:700 15px var(--body);padding:13px 14px;border-radius:12px;cursor:pointer;box-shadow:0 8px 22px rgba(217,164,65,.35);animation:glow 2.4s ease-in-out infinite}
.cta:focus-visible,.chip:focus-visible,#send:focus-visible,.vaga:focus-visible{outline:2px solid var(--lilac);outline-offset:2px}
.typing{align-self:flex-start;background:var(--glass);border:1px solid var(--glass-line);border-radius:14px;padding:11px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}

#chips{display:flex;flex-wrap:nowrap;gap:6px;padding:6px 14px 2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;mask-image:linear-gradient(90deg,#000 88%,transparent)}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;white-space:nowrap;font:inherit;font-size:13px;border:1px solid rgba(185,168,255,.45);color:var(--ink);background:rgba(185,168,255,.1);padding:7px 12px;border-radius:999px;cursor:pointer}
.chip:hover{background:rgba(185,168,255,.22)}
.chip.main{border:0;background:linear-gradient(135deg,var(--me1),var(--me2));color:var(--me-ink);font-weight:700;box-shadow:0 4px 14px rgba(217,164,65,.35)}
form{display:flex;gap:8px;padding:6px 12px calc(8px + env(safe-area-inset-bottom,0px))}
#txt{flex:1;min-width:0;font:inherit;font-size:16px;border:1px solid var(--glass-line);background:rgba(255,255,255,.06);color:var(--ink);border-radius:999px;padding:10px 15px;outline:none}
#txt::placeholder{color:var(--muted)}
#txt:focus{border-color:var(--gold)}
#send{width:42px;height:42px;flex:none;border:0;border-radius:50%;background:linear-gradient(135deg,var(--me1),var(--me2));color:var(--me-ink);cursor:pointer;display:grid;place-items:center}

@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:.3}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(14px);opacity:.2}to{transform:none;opacity:1}}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
@keyframes shine{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
@keyframes glow{0%,100%{box-shadow:0 8px 22px rgba(217,164,65,.30)}50%{box-shadow:0 8px 30px rgba(233,196,106,.6)}}
@media (prefers-reduced-motion:reduce){.msg,.typing i,.cover,.cover h1,.cta,.cover .live::before{animation:none}}

/* ===== versão fundo branco ===== */
:root{--night:#FFFFFF;--night2:#F6F3FC;--glass:#F3F0FA;--glass-line:#E3DDF1;--ink:#1F1A3A;--muted:#6B6590;--lilac:#5B47C9;color-scheme:light}
.app{background:linear-gradient(180deg,#FFFFFF 0%,#F8F5FE 100%)}
#sky{opacity:.55}
header{background:rgba(255,255,255,.88);border-bottom-color:#ECE7F6}
.msg.bot{background:#F3F0FA;border-color:#E6E0F3;backdrop-filter:none;-webkit-backdrop-filter:none}
.msg strong{color:var(--ink)}
.cover{background:#fff;border-color:rgba(200,149,47,.45);box-shadow:0 14px 34px rgba(59,42,140,.14)}
.facts div{background:#F7F4FC;border-color:#E6E0F3}
.stats div{background:#fff;border-color:#E6E0F3}
.stats b{color:#B07F22}
.msg li::marker{color:#C8952F}
.tk{color:#F3EFFF;box-shadow:0 14px 30px rgba(59,42,140,.28)}
.tk .when{color:#C9C2E6}
.tk .price span{color:#C9C2E6}
.chip{border-color:rgba(91,71,201,.35);color:#3B2A8C;background:#F4F1FC}
.chip:hover{background:#E9E3FA}
#txt{background:#F6F4FB;border-color:#E3DDF1}
.typing{background:#F3F0FA;border-color:#E6E0F3}

/* ===== quadros escuros no tom da arte principal ===== */
.tk{background:radial-gradient(120% 90% at 85% 0%,rgba(208,141,60,.28) 0%,rgba(68,37,17,.35) 35%,rgba(8,7,12,0) 70%),#08070C;border-color:rgba(233,196,106,.6);box-shadow:0 14px 30px rgba(8,7,12,.35),inset 0 0 0 1px rgba(255,255,255,.04)}
.tk .when,.tk .price span{color:#BDB3A6}
.stats div{background:radial-gradient(120% 120% at 100% 0%,rgba(208,141,60,.22),rgba(8,7,12,0) 60%),#08070C;border-color:rgba(233,196,106,.35)}
.stats b{color:#E9C46A}
.stats span{color:#BDB3A6}

/* ===== opções de perfil ===== */
#chips.stack{flex-direction:column;flex-wrap:nowrap;overflow:visible;mask-image:none;-webkit-mask-image:none;gap:8px;padding:8px 14px 4px}
#chips.stack .chip{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;border-radius:14px;font-size:15px;font-weight:600;background:#fff;border:1.5px solid rgba(91,71,201,.3);color:var(--ink)}
#chips.stack .chip small{display:block;font-weight:400;font-size:12.5px;color:var(--muted);margin-top:1px}
#chips.stack .chip .ic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:#08070C}
#chips.stack .chip .ar{margin-left:auto;color:#C8952F;font-size:18px}
#chips.wrap{flex-wrap:wrap;overflow:visible;mask-image:none;-webkit-mask-image:none;justify-content:flex-start}
#chips.wrap .chip{font-size:14px;padding:9px 14px;font-weight:600}
.msg.lista{max-width:92%}
.opts{display:grid;gap:8px;margin:10px 0 4px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:600 15px var(--body);color:var(--ink);background:#fff;border:1.5px solid rgba(200,149,47,.55);border-radius:12px;padding:11px 12px;cursor:pointer}
.opt:hover{background:#FFF8E8}
.opt .ic{flex:none;font-size:18px}
.opt .ar{margin-left:auto;color:#C8952F}
.opt:focus-visible{outline:2px solid #C8952F;outline-offset:2px}

.perfis{display:grid;gap:8px;max-width:92%;animation:pop .25s ease-out}
.pf{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;border-radius:14px;font:600 15px var(--body);background:#fff;border:1.5px solid rgba(91,71,201,.3);color:var(--ink);cursor:pointer;box-shadow:0 2px 8px rgba(59,42,140,.06)}
.pf small{display:block;font-weight:400;font-size:12.5px;color:var(--muted);margin-top:1px}
.pf .t{min-width:0}
.pf .ic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:#08070C}
.pf .ar{margin-left:auto;color:#C8952F;font-size:18px}
.pf:hover:not(:disabled){border-color:#C8952F}
.pf:focus-visible{outline:2px solid #C8952F;outline-offset:2px}
.pf:disabled{cursor:default;opacity:.45}
.pf.on:disabled{opacity:1;border-color:#C8952F;background:#FFF8E8}

.app>button#novo{position:absolute;width:auto;left:50%;transform:translateX(-50%);bottom:118px;z-index:5;border:0;cursor:pointer;font:700 13px var(--body);color:#22183F;
  background:linear-gradient(135deg,#F2D27E,#D9A441);padding:8px 14px;border-radius:999px;box-shadow:0 6px 18px rgba(59,42,140,.25);animation:pop .25s ease-out}
#novo:focus-visible{outline:2px solid #3B2A8C;outline-offset:2px}

/* rótulos dos números: sem quebrar palavras */
.stats div{padding:10px 12px}
.stats span{display:block;margin-top:4px;font-size:12.5px;line-height:1.3;letter-spacing:0;text-transform:none;overflow-wrap:normal;word-break:normal;hyphens:none;-webkit-hyphens:none}

/* destaque "Ao vivo · online" na capa */
.facts .aovivo{background:#08070C;border-color:rgba(233,196,106,.55);box-shadow:0 4px 14px rgba(220,38,38,.18)}
.facts .aovivo{position:relative}
.facts .aovivo b{color:#fff}
.facts b{white-space:nowrap;font-size:clamp(12.5px,3.7vw,14px)}
.facts .aovivo i{position:absolute;top:6px;right:6px}
.facts .aovivo i{width:6px;height:6px;border-radius:50%;background:#EF4444;box-shadow:0 0 0 0 rgba(239,68,68,.6);animation:pulso 1.6s infinite}
.facts .aovivo span{color:#E9C46A}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(239,68,68,.6)}70%{box-shadow:0 0 0 7px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
@media (prefers-reduced-motion:reduce){.facts .aovivo i{animation:none}}

.tk .grp{font-size:13px;color:#BDB3A6;text-align:center;line-height:1.4}
.tk .grp strong{color:#E9C46A}

.msg .tk strong{color:#E9C46A}
</style>

Cole aqui o código do Pixel do Meta (Gerenciador de Eventos > Pixel > Instalar código manualmente).
A página já dispara automaticamente:
  - AddToCart         quando a pessoa pede o link
  - InitiateCheckout  quando ela clica em "Garantir minha vaga"

<body>

<div class="app">

}

function intencao(t){
  t=' '+t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9$ ]/g,' ').replace(/\s+/g,' ')+' ';
  const tem=re=>re.test(t);
  if(tem(/falar com|pessoa|humano|atendente|whatsapp da equipe|telefone|contato da equipe/))return 'pessoa';
  if(tem(/grupo de aviso|entrar no grupo|grupo do whats|lembre|lembrar|lembrete|mais tarde|me avis|avisa/))return 'lembrar';
  if(tem(/grupo/)&&!tem(/whats|zap|aviso|entrar no grupo/)){
    if(tem(/ingresso|valor|preco|quanto|pessoas|equipe|desconto|empresa|compra/))return 'equipe';
    return 'grupoduvida';
  }
  if(tem(/reembols|devolu|cancel|desist|garantia|arrepend|estorno/))return 'reembolso';
  if(tem(/golpe|seguro|confiavel|confiar|e real|verdade/))return 'seguro';
  if(tem(/ pix|cartao|boleto|parcel|forma de pag|como pag|como faco pra pagar|como faco para pagar/))return 'pagamento';
  if(tem(/equipe|ingresso grupo|em grupo|grupo de pessoas|time |funcionari|colaborador|levar mais|varias pessoas|mais de uma pessoa|empresa toda|minha turma|in company|incompany/))return 'equipe';
  if(tem(/link|inscrev|inscri|compr|garantir|minha vaga|quero participar|quero ir|vou participar|bora|fechado|quero sim|^ sim $|onde pago|ingresso/))return 'link';
  if(tem(/livro|checklist|cupom/))return 'livro';
  if(tem(/ganho|ganhar|vantage|benefici|inclui|incluso|vem junto|o que tem|o que vem|o que eu levo|recebo|receber|vale a pena|por que eu|porque eu|pra que serve|para que serve/))return 'beneficio';
  if(tem(/gravad|gravacao|replay|reprise|nao posso|nao consigo|nao vou poder|horario ruim|perder a aula/))return 'aovivo';
  if(tem(/quanto tempo|dura|duracao|quantas horas|demora|termina/))return 'duracao';
  if(tem(/preco|valor|custa|quanto e|quanto fica|quanto sai|caro|investimento|r\$|reais/))return 'preco';
  if(tem(/bonus|ebook|e book|certificad|material|pdf|brinde/))return 'bonus';
  if(tem(/oficial|parceria|afiliad|trabalhou na disney|funcionario da disney|e da disney/))return 'disney';
  if(tem(/para quem|publico|serve pra|serve para|meu negocio|meu segmento|meu ramo|minha area|iniciante|pequen|clinica|loja|varejo|restaurante|salao|consultorio|servico|industria|saude/))return 'paraquem';
  if(tem(/metod|jeito disney|frentes|pilares/))return 'metodo';
  if(tem(/quem e|daniel|palestrante|professor|apresenta|curriculo|experiencia dele|formacao/))return 'quem';
  if(tem(/como assist|como funciona|acesso|acessar|sympla|plataforma|streaming|celular|computador|zoom|internet|online como/))return 'como';
  if(tem(/quando|data|que dia|qual dia|hora|horario|ao vivo|online/))return 'quando';
  if(tem(/aprend|conteudo|ensina|sobre o que|assunto|tema|palestra|disney|atendimento|cliente/))return 'aprender';
  if(tem(/obrigad|valeu|show|top|legal|otimo|perfeito|massa/))return 'obrigado';
  if(tem(/^ (oi|ola|opa|bom dia|boa tarde|boa noite|e ai|eai|hey) /))return 'oi';
  return 'outro';
}
function qualPerfil(t){
  t=t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  if(/dono|empresari|socio|proprietari|meu negocio|minha empresa/.test(t))return 'dono';
  if(/lider|gerente|gestor|supervis|coorden|diretor|equipe/.test(t))return 'lider';
  if(/atend|vend|recep|linha de frente|colaborador|funcionari/.test(t))return 'atende';
  return null;
}

async function enviar(texto){
  if(busy||!texto.trim())return;
  clearTimeout(inativo);
  const limpo=texto.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  add(limpo,'me');await wait(350);

  if(/^agora nao$|^agora não$/i.test(texto.trim())&&(modo==='nome'||modo==='fone')){
    modo='chat';setInput('chat');destino=null;
    await bot([`Sem problema! Se mudar de ideia, estou por aqui.`]);opcoes();return;
  }
  if(modo==='nome'){
    const n=texto.trim().replace(/\s+/g,' ').slice(0,80);
    if(n.length<2||!/[a-zA-ZÀ-ú]/.test(n)){await bot([`Não entendi seu nome. Pode escrever de novo?`]);botoes([["Agora não"]]);return}
    lead.nome=n.replace(/(^|\s)\S/g,c=>c.toUpperCase());await pedirFone();return;
  }
  if(modo==='fone'){
    let d=texto.replace(/\D/g,'');if(d.length===13&&d.startsWith('55'))d=d.slice(2);
    if(!foneOk(d)){await bot([`Esse número parece incompleto. Pode enviar com DDD, assim: (85) 99999-9999?`]);botoes([["Agora não"]]);return}
    lead.fone=d;await concluirContato();return;
  }
  if(perfil===null){
    await apresentar(qualPerfil(texto));return;
  }
  const k=intencao(texto);
  if(k==='link'){await enviarLink();return}
  if(k==='pessoa'){
    if(leadEnviado){destino='pessoa';await concluirContato();return}
    destino='pessoa';await pedirNome(`Claro! Vou te passar para a equipe no WhatsApp. Antes, qual é o seu nome?`);return;
  }
  if(k==='lembrar'||/^sim, me lembre$/i.test(texto)){
    await bot([`Combinado! No grupo do WhatsApp você recebe os avisos da Masterclass, a contagem regressiva e os lembretes no dia. 😉${BOTAO_GRUPO()}`]);opcoes();return;
  }
  if(/^tenho uma duvida$|^tenho uma dúvida$/i.test(texto.trim())){await bot([`Claro! Escreva sua dúvida ou escolha um dos assuntos abaixo.`]);opcoes();return}
  vistos.add(k);
  await bot(R[k]?R[k]():R.outro());
  if(k==='grupoduvida'){botoes([["Ingresso para equipe","main"],["Entrar no grupo de avisos"]]);return}
  opcoes();
}

const PERFIS_OP=[["Sou dono(a) do negócio", "🏢", "Empresário, sócio ou empreendedor"], ["Lidero uma equipe", "👥", "Gestor, gerente ou supervisor"], ["Atendo clientes ou vendo", "🤝", "Atendimento, vendas ou recepção"]];
const OP='a';
function perguntarPerfil(){
  chips.className='';
  if(OP==='b'){
    chips.innerHTML='';
    add(`<div class="opts">${PERFIS_OP.map(([t,ic])=>`<button type="button" class="opt" onclick="enviar('${t}')"><span class="ic">${ic}</span>${t}<span class="ar">›</span></button>`).join('')}</div><span style="font-size:12.5px;color:var(--muted)">Toque na opção que combina com você</span>`,'bot');
    log.lastElementChild.classList.add('lista');return;
  }
  if(OP==='c'){
    botoes(PERFIS_OP.map(([t,ic])=>[ic+' '+({"Sou dono(a) do negócio":"Sou dono(a)","Lidero uma equipe":"Lidero equipe","Atendo clientes ou vendo":"Atendo / vendo"})[t]]));
    chips.className='wrap';return;
  }
  chips.innerHTML='';
  const box=document.createElement('div');box.className='perfis';
  PERFIS_OP.forEach(([t,ic,sub])=>{const b=document.createElement('button');b.type='button';b.className='pf';
    b.innerHTML=`<span class="ic">${ic}</span><span class="t">${t}<small>${sub}</small></span><span class="ar">›</span>`;
    b.onclick=()=>{if(busy||perfil!==null)return;b.classList.add('on');enviar(t)};box.appendChild(b)});
  log.appendChild(box);
  rolar();
}

(()=>{const c=document.getElementById('sky'),x=c.getContext('2d');let W,H,S=[];
 const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
 function size(){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);
  S=Array.from({length:Math.round(W*H/5200)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.3,p:Math.random()*6.3,g:Math.random()<.35}))}
 function draw(t){x.clearRect(0,0,W,H);for(const s of S){const a=calm?.6:.35+.45*Math.sin(t/900+s.p);x.globalAlpha=Math.max(.08,a);x.fillStyle=s.g?'#D4A646':'#B9AEE8';x.beginPath();x.arc(s.x,s.y,s.r,0,6.3);x.fill()}
