<style>
/* Layout: chat em tela única sobre um "céu noturno" com estrelas douradas; capa do evento abre a conversa; oferta como ingresso */
:root{
  --night:#0B0A1F; --night2:#1B1446; --glass:rgba(255,255,255,.07); --glass-line:rgba(255,255,255,.12);
  --ink:#F3EFFF; --muted:#A9A3C9; --gold:#E9C46A; --gold2:#C8952F; --lilac:#B9A8FF; --me1:#F2D27E; --me2:#D9A441; --me-ink:#22183F;
  --display:"Fraunces", Georgia, serif; --body:"Figtree", system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:15px}
.app{position:relative;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(120% 60% at 50% -10%,#3A2A8C 0%,var(--night2) 38%,var(--night) 75%)}
#sky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.app>*:not(#sky){position:relative;z-index:1}

header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(11,10,31,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--glass-line)}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:30% 20%;flex:none;box-shadow:0 0 0 2px var(--night),0 0 0 3.5px var(--gold),0 0 18px rgba(233,196,106,.45)}
.who{min-width:0;flex:1}
.who b{display:flex;align-items:center;gap:5px;font-family:var(--display);font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden}
.who b svg{flex:none}
.who span{font-size:12px;color:var(--muted);white-space:nowrap}
.who span.on::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#3DDC84;margin-right:6px;vertical-align:1px;box-shadow:0 0 8px #3DDC84}
.vaga{flex:none;font:600 12.5px var(--body);color:var(--me-ink);background:linear-gradient(135deg,var(--me1),var(--me2));border:0;border-radius:999px;padding:8px 12px;cursor:pointer;box-shadow:0 4px 16px rgba(217,164,65,.35)}

#log{flex:1;overflow-y:auto;padding:14px 14px 10px;display:flex;flex-direction:column;gap:8px}
.day{align-self:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--glass);padding:4px 10px;border-radius:8px}

/* capa do evento */
.cover{border-radius:18px;overflow:hidden;border:1px solid rgba(233,196,106,.35);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));box-shadow:0 18px 40px rgba(0,0,0,.35);animation:rise .6s ease-out}
.cover .ph{position:relative;aspect-ratio:16/10;max-width:100%;background:url(../daniel.jpg) 30% 22%/cover no-repeat}
.cover .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,10,31,0) 35%,rgba(11,10,31,.92) 100%)}
.cover .ed{position:absolute;top:12px;left:12px;z-index:1;font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--me-ink);background:var(--gold);padding:5px 9px;border-radius:6px}
.cover .live{position:absolute;top:12px;right:12px;z-index:1;font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:rgba(220,38,38,.9);padding:5px 9px;border-radius:6px}
.cover .live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;margin-right:6px;vertical-align:1px;animation:blink 1.4s infinite}
.cover .tx{position:relative;margin-top:-64px;padding:0 16px 16px;z-index:1}
.cover h1{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(28px,8vw,36px);line-height:1.02;text-wrap:balance;
  background:linear-gradient(100deg,#FFF6DA 0%,var(--gold) 45%,#FFF6DA 60%,var(--gold2) 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s ease-in-out infinite}
.cover p{margin:6px 0 12px;color:var(--muted);font-size:14px}
.cover p strong{color:var(--ink);font-weight:600}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.facts div{background:var(--glass);border:1px solid var(--glass-line);border-radius:10px;padding:7px 4px;text-align:center}
.facts b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.facts span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* mensagens */
.msg{max-width:86%;padding:9px 12px 6px;border-radius:14px;line-height:1.45;animation:pop .25s ease-out;overflow-wrap:anywhere}
.msg.bot{align-self:flex-start;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-top-left-radius:4px}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--me1),var(--me2));color:var(--me-ink);border-top-right-radius:4px;box-shadow:0 6px 18px rgba(217,164,65,.25)}
.msg time{display:block;text-align:right;font-size:10.5px;color:var(--muted);margin-top:2px}
.msg.me time{color:rgba(34,24,63,.6)}
.msg ul{margin:6px 0 2px;padding-left:18px}
.msg li{margin:3px 0}
.msg li::marker{color:var(--gold)}
.msg strong{font-weight:600;color:#fff}
.msg.me strong{color:inherit}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 2px}
.stats div{border:1px solid var(--glass-line);background:rgba(255,255,255,.04);border-radius:10px;padding:8px 10px}
.stats b{display:block;font-family:var(--display);font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.1}
.stats span{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}

/* oferta em formato de ingresso */
.msg.ticket{padding:0;max-width:92%;background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none}
.tk{position:relative;border-radius:16px;background:linear-gradient(160deg,#2B2066,#171238);border:1px solid rgba(233,196,106,.55);box-shadow:0 14px 34px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.04)}
.tk .top{padding:14px 16px 12px}
.tk .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.tk .nm{font-family:var(--display);font-size:19px;font-weight:600;margin:4px 0 2px;line-height:1.2}
.tk .when{font-size:13px;color:var(--muted)}
.tk .cut{position:relative;height:0;border-top:2px dashed rgba(233,196,106,.35);margin:0 14px}
.tk .cut::before,.tk .cut::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--night)}
.tk .cut::before{left:-25px}.tk .cut::after{right:-25px}
.tk .bot{padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px}
.tk .price{display:flex;align-items:baseline;gap:8px}
.tk .price b{font-family:var(--display);font-size:34px;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.tk .price span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.tk ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14px}
.tk li::before{content:"✦";color:var(--gold);margin-right:8px}
.tk time{padding:0 16px 8px;margin:0}

.cta{display:block;margin-top:8px;text-align:center;background:linear-gradient(135deg,var(--me1),var(--me2));color:var(--me-ink);text-decoration:none;border:0;width:100%;
  font:700 15px var(--body);padding:13px 14px;border-radius:12px;cursor:pointer;box-shadow:0 8px 22px rgba(217,164,65,.35);animation:glow 2.4s ease-in-out infinite}
.cta:focus-visible,.chip:focus-visible,#send:focus-visible,.vaga:focus-visible{outline:2px solid var(--lilac);outline-offset:2px}
.typing{align-self:flex-start;background:var(--glass);border:1px solid var(--glass-line);border-radius:14px;padding:11px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}

#chips{display:flex;flex-wrap:nowrap;gap:6px;padding:6px 14px 2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;mask-image:linear-gradient(90deg,#000 88%,transparent)}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;white-space:nowrap;font:inherit;font-size:13px;border:1px solid rgba(185,168,255,.45);color:var(--ink);background:rgba(185,168,255,.1);padding:7px 12px;border-radius:999px;cursor:pointer}
.chip:hover{background:rgba(185,168,255,.22)}
.chip.main{border:0;background:linear-gradient(135deg,var(--me1),var(--me2));color:var(--me-ink);font-weight:700;box-shadow:0 4px 14px rgba(217,164,65,.35)}
form{display:flex;gap:8px;padding:6px 12px calc(8px + env(safe-area-inset-bottom,0px))}
#txt{flex:1;min-width:0;font:inherit;font-size:16px;border:1px solid var(--glass-line);background:rgba(255,255,255,.06);color:var(--ink);border-radius:999px;padding:10px 15px;outline:none}
#txt::placeholder{color:var(--muted)}
#txt:focus{border-color:var(--gold)}
#send{width:42px;height:42px;flex:none;border:0;border-radius:50%;background:linear-gradient(135deg,var(--me1),var(--me2));color:var(--me-ink);cursor:pointer;display:grid;place-items:center}

@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:.3}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(14px);opacity:.2}to{transform:none;opacity:1}}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
@keyframes shine{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
@keyframes glow{0%,100%{box-shadow:0 8px 22px rgba(217,164,65,.30)}50%{box-shadow:0 8px 30px rgba(233,196,106,.6)}}
@media (prefers-reduced-motion:reduce){.msg,.typing i,.cover,.cover h1,.cta,.cover .live::before{animation:none}}
</style>

Cole aqui o código do Pixel do Meta (Gerenciador de Eventos > Pixel > Instalar código manualmente).

Modo teste: abra a página com ?teste no final do link para ver se o lead foi enviado.

</head>
<body>

<div class="app">
  <canvas id="sky" aria-hidden="true"></canvas>
  <header>
    <img class="avatar" id="av" src="../daniel.jpg" alt="Daniel Donato">
    <div class="who"><b id="nm">Equipe Daniel Donato <svg width="15" height="15" viewBox="0 0 24 24" aria-label="verificado"><path fill="#E9C46A" d="M12 1.5l2.6 1.9 3.2-.2 1 3 2.7 1.8-.9 3.1.9 3.1-2.7 1.8-1 3-3.2-.2L12 22.5l-2.6-1.9-3.2.2-1-3-2.7-1.8.9-3.1-.9-3.1 2.7-1.8 1-3 3.2.2z"/><path fill="none" stroke="#22183F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M8 12.3l2.7 2.7L16.2 9.5"/></svg></b><span class="on" id="st">online</span></div>
    <button type="button" class="vaga" id="vaga">Vaga R$ 47</button>
  </header>
  <div id="log" aria-live="polite"><div class="day">Hoje</div></div>
  <div id="chips"></div>
  <form id="f">
    <label for="txt" hidden>Mensagem</label>
    <input id="txt" autocomplete="off" placeholder="Digite sua mensagem">
    <input id="hp" name="empresa" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
    <button id="send" aria-label="Enviar"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20.5 21 12 3 3.5l2.6 7.1L14 12l-8.4 1.4z"/></svg></button>
  </form>
</div>

<script>
/* ====== DADOS DA MASTERCLASS (edite aqui) ====== */
const CONFIG = {
  titulo: "27ª Masterclass: Atendimento Mágico! Um Case Disney",
  data: "quinta-feira, 26 de novembro",
  dataCurta: "26/11",
  horario: "das 19h00 às 21h30 (horário de Brasília)",
  plataforma: "Sympla Streaming",
  preco: "R$ 47",
  linkPagamento: "",                 /* cole aqui o link do Sympla */
  whatsapp: "5585999711108",         /* WhatsApp da equipe */
  mensagemWhats: "Olá! Sou {nome} e quero saber mais sobre a Masterclass Atendimento Mágico online ({data}).",
  leadAPI: "/api/lead",              /* mesma captura de leads da página principal */
  planilhaURL: ""                    /* opcional: URL do Google Apps Script */
};
/* ============================================== */

const log=document.getElementById('log'), chips=document.getElementById('chips'), st=document.getElementById('st'), txt=document.getElementById('txt');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const hora=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const params=new URLSearchParams(location.search);
const TESTE=params.has('teste');
function track(ev){try{window.fbq&&fbq('track',ev)}catch(e){}}
let busy=false, perfil=null, modo='chat', destino=null, lead={nome:'',fone:''}, leadEnviado=false, lembreteFeito=false, ofertaMostrada=false, inativo=null;
const vistos=new Set();
const EVENTO=new Date('2026-11-26T19:00:00-03:00');
const dias=Math.ceil((EVENTO-new Date())/864e5);
const STATUS=dias>1?`online · faltam ${dias} dias`:dias===1?'online · é amanhã!':dias===0?'online · é hoje!':'online';
st.textContent=STATUS;

/* ---------- interface ---------- */
function add(html,who){
  const d=document.createElement('div');d.className='msg '+(who==='bot'&&html.startsWith('<div class="tk"')?'bot ticket':who);
  d.innerHTML=html+'<time>'+hora()+'</time>';log.appendChild(d);log.scrollTop=log.scrollHeight;
}
async function bot(list){
  busy=true;chips.innerHTML='';clearTimeout(inativo);
  for(const html of list){
    const t=document.createElement('div');t.className='typing';t.innerHTML='<i></i><i></i><i></i>';
    log.appendChild(t);log.scrollTop=log.scrollHeight;st.textContent='digitando…';st.className='';
    await wait(Math.min(1900,600+html.replace(/<[^>]+>/g,'').length*11));
    t.remove();add(html,'bot');await wait(320);
  }
  st.textContent=STATUS;st.className='on';busy=false;
}
function botoes(lista){
  chips.innerHTML='';
  lista.forEach(([t,cls])=>{const b=document.createElement('button');b.type='button';b.className='chip'+(cls?' '+cls:'');b.textContent=t;b.onclick=()=>enviar(t);chips.appendChild(b)});
  chips.scrollLeft=0;
}
const TOPICOS=[["O que vou aprender?","aprender"],["Quem é o Daniel?","quem"],["Quanto custa?","preco"],["Data e horário","quando"],["Quais os bônus?","bonus"],["Para quem é?","paraquem"],["Como assisto?","como"]];
function opcoes(){
  if(modo!=='chat')return;
  const l=[["Eu quero o link","main"]];
  TOPICOS.filter(([,k])=>!vistos.has(k)).forEach(([t])=>l.push([t]));
  if(!leadEnviado)l.push(["Me lembre depois"]);
  l.push(["Falar com uma pessoa"]);
  botoes(l);
  agendarLembrete();
}
function setInput(tipo){
  if(tipo==='fone'){txt.type='tel';txt.inputMode='numeric';txt.placeholder='(00) 90000-0000';txt.autocomplete='tel-national'}
  else if(tipo==='nome'){txt.type='text';txt.inputMode='text';txt.placeholder='Seu nome';txt.autocomplete='given-name'}
  else{txt.type='text';txt.inputMode='text';txt.placeholder='Digite sua mensagem';txt.autocomplete='off'}
}

/* ---------- conteúdo ---------- */
const convite=`Faz sentido para você? Se quiser garantir a vaga, é só tocar em <strong>"Eu quero o link"</strong>.`;
const PROVA=`E não é teoria: esta é a <strong>27ª edição</strong> da Masterclass. Já foram 26 turmas antes desta.
  <div class="stats"><div><b>+50 mil</b><span>profissionais treinados</span></div><div><b>+20</b><span>visitas técnicas à Disney</span></div>
  <div><b>20 anos</b><span>de consultoria</span></div><div><b>26</b><span>turmas anteriores</span></div></div>`;
const OFERTA=()=>`<div class="tk"><div class="top"><div class="lbl">Ingresso · 27ª edição</div><div class="nm">Atendimento Mágico! Um Case Disney</div><div class="when">${CONFIG.data} · ${CONFIG.horario}<br>Online e ao vivo · ${CONFIG.plataforma}</div></div>
  <div class="cut"></div>
  <div class="bot"><div class="price"><b>${CONFIG.preco}</b><span>valor único</span></div>
  <ul><li>Material de apoio em PDF</li><li>E-book <em>Além dos Bastidores</em></li><li>Certificado de participação</li></ul>
  <button type="button" class="cta" onclick="enviar('Eu quero o link')">Quero minha vaga</button></div></div>`;

const PERFIS={
  dono:[`Então você sabe: o cliente não volta só pelo produto, ele volta pela experiência. O difícil é fazer a equipe inteira entregar o mesmo padrão, inclusive quando você não está por perto.`,
        `Na Masterclass, o Daniel Donato mostra como a Disney faz milhares de pessoas encantarem no mesmo padrão, e como levar isso para a realidade da sua empresa.`],
  lider:[`Liderar atendimento tem um desafio clássico: um dia a equipe brilha, no outro alguém derruba a experiência do cliente.`,
         `Na Masterclass, o Daniel Donato mostra os padrões que a Disney usa para encantar em escala e como preparar a sua equipe para cada contato com o cliente.`],
  atende:[`Quem está na linha de frente sabe: o cliente pode esquecer o preço, mas lembra de como foi tratado.`,
          `Na Masterclass, o Daniel Donato ensina atitudes simples, para aplicar no dia seguinte, que criam o efeito UAU e fazem o cliente voltar e indicar.`]
};

const R={
  aprender:()=>[
    `Na Disney, cada contato com o cliente é tratado como parte de um <strong>espetáculo</strong>. Você vai aprender:<ul>
      <li>Por que cada contato com o cliente é um "espetáculo" e como preparar a equipe para ele</li>
      <li>Os padrões de atendimento que a Disney usa para encantar em escala</li>
      <li>Como transformar clientes satisfeitos em clientes fiéis e promotores da marca</li>
      <li>Atitudes simples que criam o efeito UAU no dia a dia da sua empresa</li></ul>`,
    `Tudo com exemplos vividos em mais de 20 visitas técnicas aos parques e lojas da Disney. ${convite}`],
  quem:()=>[
    `O <strong>Daniel Donato</strong> é palestrante e consultor especialista em Experiência do Cliente, Cultura Disney e Desenvolvimento de Pessoas, com 10 anos de palco.`,
    `Tem certificação em Guestologia Business pelo Seeds of Dreams Institute e fez os programas Backstage Magic e Keys to the Kingdom pelo Disney Institute. É formado em Administração, com MBA em Marketing Estratégico e de Relacionamento, e é autor do livro <strong>"Checklist Cliente Feliz: Atendimento de Alto Impacto"</strong>.`,
    convite],
  quando:()=>[`A Masterclass acontece na <strong>${CONFIG.data}</strong>, <strong>${CONFIG.horario}</strong>, online e ao vivo. Você assiste de onde estiver, pelo computador ou celular.`,convite],
  paraquem:()=>[`É para todo mundo que tem contato com cliente ou lidera quem tem:<ul>
      <li>Donos de negócio, diretores, gerentes e supervisores</li><li>Equipes de atendimento e vendas</li><li>Colaboradores em geral</li></ul>`,
    `Serve para varejo, saúde, serviços e indústria. ${convite}`],
  bonus:()=>[`Quem participa leva 3 bônus 🎁<ul><li>Material de apoio em PDF</li><li>E-book <strong>Além dos Bastidores</strong></li><li>Certificado virtual de participação</li></ul>`,convite],
  como:()=>[`A transmissão é feita pelo <strong>${CONFIG.plataforma}</strong>. Depois da inscrição, o Sympla envia por e-mail as instruções de acesso. No dia, é só entrar pelo link.`,convite],
  metodo:()=>[`O método do Daniel é <strong>O Jeito Disney, na prática</strong>: cinco frentes que se conectam para transformar cultura em experiência.<ul>
      <li><strong>Cultura:</strong> clareza sobre o padrão de experiência que a empresa quer entregar</li>
      <li><strong>Pessoas:</strong> comportamentos e atitudes que sustentam esse padrão</li>
      <li><strong>Atendimento:</strong> princípios viram comportamentos na jornada do cliente</li>
      <li><strong>Liderança:</strong> líderes preparados para sustentar a cultura no dia a dia</li>
      <li><strong>Experiência:</strong> cada contato vira uma oportunidade de criar valor</li></ul>`,convite],
  preco:()=>[`O ingresso tem valor único de <strong>${CONFIG.preco}</strong>, já com os 3 bônus: material de apoio, e-book e certificado.`,convite],
  aovivo:()=>[`A Masterclass é ao vivo, assim você acompanha os exemplos e tira dúvidas na hora com o Daniel.`,`Se o horário for um problema para você, toque em <strong>"Falar com uma pessoa"</strong> que a equipe te ajuda.`],
  oi:()=>[`Olá! 😊 Posso te contar o que você vai aprender, quem é o Daniel, a data, o valor ou já te mandar o link. O que prefere?`],
  obrigado:()=>[`Imagina! Estou por aqui se precisar de algo mais. 💜`],
  outro:()=>[`Boa pergunta! Posso te ajudar com o conteúdo, o palestrante, a data, o valor e os bônus. Se for algo mais específico, toque em <strong>"Falar com uma pessoa"</strong> que a equipe te responde no WhatsApp.`]
};

function intencao(t){
  t=t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  if(/falar com|pessoa|humano|atendente|whats|zap/.test(t))return 'pessoa';
  if(/lembre|lembrar|depois|mais tarde|aviso|avisa/.test(t))return 'lembrar';
  if(/link|quero|inscri|compr|pagar|pagamento|garantir|vaga|bora|fechado|ingresso/.test(t))return 'link';
  if(/gravad|gravacao|replay|reprise|nao posso|nao consigo|horario ruim/.test(t))return 'aovivo';
  if(/preco|valor|custa|quanto|parcel|caro|investimento/.test(t))return 'preco';
  if(/bonus|ebook|e-book|certificado|material|pdf/.test(t))return 'bonus';
  if(/para quem|publico|serve pra|serve para|meu negocio|meu segmento/.test(t))return 'paraquem';
  if(/metod|jeito disney|frentes/.test(t))return 'metodo';
  if(/quem e|daniel|palestrante|professor|apresenta|curriculo/.test(t))return 'quem';
  if(/como assist|acesso|acessar|sympla|plataforma|streaming|celular/.test(t))return 'como';
  if(/quando|data|dia|hora|horario|ao vivo|online/.test(t))return 'quando';
  if(/aprend|conteudo|ensina|sobre o que|assunto|tema|palestra/.test(t))return 'aprender';
  if(/obrigad|valeu|show|top|legal/.test(t))return 'obrigado';
  if(/^(oi|ola|bom dia|boa tarde|boa noite|e ai)\b/.test(t))return 'oi';
  return 'outro';
}
function qualPerfil(t){
  t=t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  if(/dono|empresari|socio|proprietari|meu negocio|minha empresa/.test(t))return 'dono';
  if(/lider|gerente|gestor|supervis|coorden|diretor|equipe/.test(t))return 'lider';
  if(/atend|vend|recep|linha de frente|colaborador|funcionari/.test(t))return 'atende';
  return null;
}

/* ---------- fluxo principal ---------- */
async function apresentar(p){
  perfil=p||'geral';
  await bot([...(p?PERFIS[p]:[`Na Masterclass, o Daniel Donato mostra como a Disney transforma cada atendimento em um espetáculo, e como levar esse efeito UAU para a sua empresa.`]),PROVA,OFERTA()]);
  ofertaMostrada=true;opcoes();
}

async function enviarLink(){
  track('AddToCart');
  if(CONFIG.linkPagamento){
    await bot([`Ótimo! 🎉 Aqui está o seu link para garantir a vaga:`,
      `<strong>${CONFIG.titulo}</strong><br>${CONFIG.dataCurta}, ${CONFIG.horario}<br>Ingresso: <strong>${CONFIG.preco}</strong><a class="cta" href="${CONFIG.linkPagamento}" target="_blank" rel="noopener" onclick="track('InitiateCheckout')">Garantir minha vaga</a>`,
      `Depois da inscrição, o Sympla envia o acesso para o seu e-mail. Te vejo lá! ✨`]);
    opcoes();
  }else{
    await bot([`Ótimo! 🎉 As inscrições abrem em breve.`]);
    if(leadEnviado){await bot([`Já anotei seu contato, ${lead.nome}. Assim que abrir, a equipe te chama no WhatsApp.`]);opcoes();}
    else{destino='aviso';await pedirNome(`Me diz seu nome e WhatsApp que a equipe te avisa assim que abrir. Qual é o seu nome?`);}

}

/* ---------- captura de contato ---------- */
async function pedirNome(texto){
  modo='nome';setInput('nome');
  await bot([texto]);
  botoes([["Agora não"]]);txt.focus();
}
async function pedirFone(){
  modo='fone';setInput('fone');
  await bot([`Prazer, ${lead.nome}! E qual é o seu WhatsApp com DDD?`]);
  botoes([["Agora não"]]);txt.focus();
}
const DDDS='11 12 13 14 15 16 17 18 19 21 22 24 27 28 31 32 33 34 35 37 38 41 42 43 44 45 46 47 48 49 51 53 54 55 61 62 63 64 65 66 67 68 69 71 73 74 75 77 79 81 82 83 84 85 86 87 88 89 91 92 93 94 95 96 97 98 99'.split(' ');
function foneOk(d){return d.length===11&&DDDS.includes(d.slice(0,2))&&d[2]==='9'&&!/^(\d)\1+$/.test(d.slice(2))}

let ficha=null;
function pegarFicha(){if(!CONFIG.leadAPI)return Promise.resolve(null);return fetch(CONFIG.leadAPI,{cache:'no-store'}).then(r=>r.json()).then(j=>{j.local=Date.now();ficha=j;return j}).catch(()=>null)}
const fichaPronta=pegarFicha();

async function registrarLead(){
  leadEnviado=true;track('Lead');
  const utm={utm_source:params.get('utm_source')||'instagram',utm_campaign:params.get('utm_campaign')||'Chat Masterclass Online '+CONFIG.dataCurta,utm_content:params.get('utm_content')||(perfil?'perfil: '+perfil:'')};
  const envios=[];
  if(CONFIG.leadAPI){
    envios.push(fichaPronta.then(f=>f||pegarFicha()).then(async f=>{
      const falta=f&&f.local?2300-(Date.now()-f.local):0;if(falta>0)await wait(falta);
      return fetch(CONFIG.leadAPI,{method:'POST',keepalive:true,headers:{'Content-Type':'application/json'},
        body:JSON.stringify({nome:lead.nome,whatsapp:lead.fone,empresa:document.getElementById('hp').value,t:f&&f.t,k:f&&f.k,...utm,teste:TESTE})});
    }).then(r=>r.json()).then(j=>{if(TESTE)add('<em>Teste: '+(j.sent?'e-mail enviado ✓':'não enviado ('+(j.motivo||'?')+')')+'</em>','bot')}).catch(e=>{if(TESTE)add('<em>Teste: falha ao conectar</em>','bot')}));
  }
  if(CONFIG.planilhaURL){
    envios.push(fetch(CONFIG.planilhaURL,{method:'POST',mode:'no-cors',keepalive:true,body:new URLSearchParams({nome:lead.nome,whatsapp:'55'+lead.fone,data:new Date().toLocaleString('pt-BR'),...utm})}));
  }
  return Promise.allSettled(envios);
}

async function concluirContato(){
  modo='chat';setInput('chat');
  registrarLead();
  const nome1=lead.nome.split(' ')[0];
  if(destino==='pessoa'){
    const link='https://wa.me/'+CONFIG.whatsapp+'?text='+encodeURIComponent(CONFIG.mensagemWhats.replace('{nome}',nome1).replace('{data}',CONFIG.dataCurta));
    await bot([`Pronto, ${nome1}! Toque no botão para falar direto com a equipe:<a class="cta" href="${link}" target="_blank" rel="noopener" onclick="track('Contact')">Abrir conversa no WhatsApp</a>`]);
  }else if(destino==='aviso'){
    await bot([`Anotado, ${nome1}! ✅ Assim que as inscrições abrirem, a equipe te chama no WhatsApp com o link.`]);
  }else{
    await bot([`Anotado, ${nome1}! ✅ A equipe vai te chamar no WhatsApp antes da Masterclass para te lembrar.`,
      CONFIG.linkPagamento?`Se quiser já garantir a vaga pelo valor de ${CONFIG.preco}, é só tocar em <strong>"Eu quero o link"</strong>.`:`Enquanto isso, fique à vontade para tirar qualquer dúvida por aqui.`]);
  }
  destino=null;opcoes();
}

/* lembrete se a pessoa ficar parada depois de ver a oferta */
function agendarLembrete(){
  clearTimeout(inativo);
  if(lembreteFeito||leadEnviado||!ofertaMostrada)return;
  inativo=setTimeout(async()=>{
    if(busy||modo!=='chat'||leadEnviado)return;
    lembreteFeito=true;
    await bot([`Ainda está por aí? 😊 Se agora não for o momento, posso pedir para a equipe te lembrar da Masterclass pelo WhatsApp.`]);
    botoes([["Sim, me lembre","main"],["Eu quero o link"],["Tenho uma dúvida"]]);
  },45000);
}

/* ---------- entrada da pessoa ---------- */
async function enviar(texto){
  if(busy||!texto.trim())return;
  clearTimeout(inativo);
  const limpo=texto.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  add(limpo,'me');await wait(350);

  if(/^agora nao$|^agora não$/i.test(texto.trim())&&(modo==='nome'||modo==='fone')){
    modo='chat';setInput('chat');destino=null;
    await bot([`Sem problema! Se mudar de ideia, estou por aqui.`]);opcoes();return;
  }
  if(modo==='nome'){
    const n=texto.trim().replace(/\s+/g,' ').slice(0,80);
    if(n.length<2||!/[a-zA-ZÀ-ú]/.test(n)){await bot([`Não entendi seu nome. Pode escrever de novo?`]);botoes([["Agora não"]]);return}
    lead.nome=n.replace(/(^|\s)\S/g,c=>c.toUpperCase());await pedirFone();return;
  }
  if(modo==='fone'){
    let d=texto.replace(/\D/g,'');if(d.length===13&&d.startsWith('55'))d=d.slice(2);
    if(!foneOk(d)){await bot([`Esse número parece incompleto. Pode enviar com DDD, assim: (85) 99999-9999?`]);botoes([["Agora não"]]);return}
    lead.fone=d;await concluirContato();return;
  }
  if(perfil===null){
    await apresentar(qualPerfil(texto));return;
  }
  const k=intencao(texto);
  if(k==='link'){await enviarLink();return}
  if(k==='pessoa'){
    if(leadEnviado){destino='pessoa';await concluirContato();return}
    destino='pessoa';await pedirNome(`Claro! Vou te passar para a equipe no WhatsApp. Antes, qual é o seu nome?`);return;
  }
  if(k==='lembrar'||/^sim, me lembre$/i.test(texto)){
    if(leadEnviado){await bot([`Seu contato já está anotado, ${lead.nome.split(' ')[0]}. A equipe vai te lembrar! 😉`]);opcoes();return}
    destino='lembrete';await pedirNome(`Combinado! Qual é o seu nome?`);return;
  }
  if(/^tenho uma duvida$|^tenho uma dúvida$/i.test(texto.trim())){await bot([`Claro! Escreva sua dúvida ou escolha um dos assuntos abaixo.`]);opcoes();return}
  vistos.add(k);
  await bot(R[k]?R[k]():R.outro());opcoes();
}

/* céu estrelado */
(()=>{const c=document.getElementById('sky'),x=c.getContext('2d');let W,H,S=[];
 const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
 function size(){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);
  S=Array.from({length:Math.round(W*H/5200)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.3,p:Math.random()*6.3,g:Math.random()<.35}))}
 function draw(t){x.clearRect(0,0,W,H);for(const s of S){const a=calm?.6:.35+.45*Math.sin(t/900+s.p);x.globalAlpha=Math.max(.08,a);x.fillStyle=s.g?'#E9C46A':'#FFFFFF';x.beginPath();x.arc(s.x,s.y,s.r,0,6.3);x.fill()}
  if(!calm)requestAnimationFrame(draw)}
 size();addEventListener('resize',size);requestAnimationFrame(draw)})();
</script>
