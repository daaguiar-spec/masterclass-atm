<script>
/* ====== DADOS DA MASTERCLASS (edite aqui) ====== */
const CONFIG = {

  dataCurta: "26/11",

/* ============================================== */

const log=document.getElementById('log'), chips=document.getElementById('chips'), st=document.getElementById('st'), txt=document.getElementById('txt');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const hora=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const params=new URLSearchParams(location.search);
const TESTE=params.has('teste');
function track(ev){try{window.fbq&&fbq('track',ev)}catch(e){}}
let busy=false, perfil=null, modo='chat', destino=null, lead={nome:'',fone:''}, leadEnviado=false, lembreteFeito=false, ofertaMostrada=false, inativo=null;
const vistos=new Set();

/* ---------- interface ---------- */
function add(html,who){
  const d=document.createElement('div');d.className='msg '+who;
  d.innerHTML=html+'<time>'+hora()+'</time>';log.appendChild(d);log.scrollTop=log.scrollHeight;
}
async function bot(list){
  busy=true;chips.innerHTML='';clearTimeout(inativo);
  for(const html of list){
    const t=document.createElement('div');t.className='typing';t.innerHTML='<i></i><i></i><i></i>';
    log.appendChild(t);log.scrollTop=log.scrollHeight;st.textContent='digitando…';st.className='';
    await wait(Math.min(1900,600+html.replace(/<[^>]+>/g,'').length*11));
    t.remove();add(html,'bot');await wait(320);
  }
  st.textContent='online';st.className='on';busy=false;
}
function botoes(lista){
  chips.innerHTML='';
  lista.forEach(([t,cls])=>{const b=document.createElement('button');b.type='button';b.className='chip'+(cls?' '+cls:'');b.textContent=t;b.onclick=()=>enviar(t);chips.appendChild(b)});
  chips.scrollLeft=0;
}
const TOPICOS=[["O que vou aprender?","aprender"],["Quem é o Daniel?","quem"],["Quanto custa?","preco"],["Data e horário","quando"],["Quais os bônus?","bonus"],["Para quem é?","paraquem"],["Como assisto?","como"]];
function opcoes(){
  if(modo!=='chat')return;
  const l=[["Eu quero o link","main"]];
  TOPICOS.filter(([,k])=>!vistos.has(k)).forEach(([t])=>l.push([t]));
  if(!leadEnviado)l.push(["Me lembre depois"]);
  l.push(["Falar com uma pessoa"]);
  botoes(l);
  agendarLembrete();
}
function setInput(tipo){
  if(tipo==='fone'){txt.type='tel';txt.inputMode='numeric';txt.placeholder='(00) 90000-0000';txt.autocomplete='tel-national'}
  else if(tipo==='nome'){txt.type='text';txt.inputMode='text';txt.placeholder='Seu nome';txt.autocomplete='given-name'}
  else{txt.type='text';txt.inputMode='text';txt.placeholder='Digite sua mensagem';txt.autocomplete='off'}
}

/* ---------- conteúdo ---------- */
const convite=`Faz sentido para você? Se quiser garantir a vaga, é só tocar em <strong>"Eu quero o link"</strong>.`;
const PROVA=`E não é teoria: esta é a <strong>27ª edição</strong> da Masterclass. Já foram 26 turmas antes desta.
  <div class="stats"><div><b>+50 mil</b><span>profissionais treinados</span></div><div><b>+20</b><span>visitas técnicas à Disney</span></div>
  <div><b>20 anos</b><span>de consultoria</span></div><div><b>26</b><span>turmas anteriores</span></div></div>`;
const OFERTA=()=>`📅 <strong>${CONFIG.data}</strong>, ${CONFIG.horario}, online e ao vivo.<br>🎟️ Ingresso: <strong>${CONFIG.preco}</strong>, já com 3 bônus: material de apoio em PDF, e-book <em>Além dos Bastidores</em> e certificado de participação.`;

const PERFIS={
  dono:[`Então você sabe: o cliente não volta só pelo produto, ele volta pela experiência. O difícil é fazer a equipe inteira entregar o mesmo padrão, inclusive quando você não está por perto.`,
        `Na Masterclass, o Daniel Donato mostra como a Disney faz milhares de pessoas encantarem no mesmo padrão, e como levar isso para a realidade da sua empresa.`],
  lider:[`Liderar atendimento tem um desafio clássico: um dia a equipe brilha, no outro alguém derruba a experiência do cliente.`,
         `Na Masterclass, o Daniel Donato mostra os padrões que a Disney usa para encantar em escala e como preparar a sua equipe para cada contato com o cliente.`],
  atende:[`Quem está na linha de frente sabe: o cliente pode esquecer o preço, mas lembra de como foi tratado.`,
          `Na Masterclass, o Daniel Donato ensina atitudes simples, para aplicar no dia seguinte, que criam o efeito UAU e fazem o cliente voltar e indicar.`]
};

const R={
  aprender:()=>[
    `Na Disney, cada contato com o cliente é tratado como parte de um <strong>espetáculo</strong>. Você vai aprender:<ul>
      <li>Por que cada contato com o cliente é um "espetáculo" e como preparar a equipe para ele</li>
      <li>Os padrões de atendimento que a Disney usa para encantar em escala</li>
      <li>Como transformar clientes satisfeitos em clientes fiéis e promotores da marca</li>
      <li>Atitudes simples que criam o efeito UAU no dia a dia da sua empresa</li></ul>`,
    `Tudo com exemplos vividos em mais de 20 visitas técnicas aos parques e lojas da Disney. ${convite}`],
  quem:()=>[
    `O <strong>Daniel Donato</strong> é palestrante e consultor especialista em Experiência do Cliente, Cultura Disney e Desenvolvimento de Pessoas, com 10 anos de palco.`,
    `Tem certificação em Guestologia Business pelo Seeds of Dreams Institute e fez os programas Backstage Magic e Keys to the Kingdom pelo Disney Institute. É formado em Administração, com MBA em Marketing Estratégico e de Relacionamento, e é autor do livro <strong>"Checklist Cliente Feliz: Atendimento de Alto Impacto"</strong>.`,
    convite],
  quando:()=>[`A Masterclass acontece na <strong>${CONFIG.data}</strong>, <strong>${CONFIG.horario}</strong>, online e ao vivo. Você assiste de onde estiver, pelo computador ou celular.`,convite],
  paraquem:()=>[`É para todo mundo que tem contato com cliente ou lidera quem tem:<ul>
      <li>Donos de negócio, diretores, gerentes e supervisores</li><li>Equipes de atendimento e vendas</li><li>Colaboradores em geral</li></ul>`,
    `Serve para varejo, saúde, serviços e indústria. ${convite}`],
  bonus:()=>[`Quem participa leva 3 bônus 🎁<ul><li>Material de apoio em PDF</li><li>E-book <strong>Além dos Bastidores</strong></li><li>Certificado virtual de participação</li></ul>`,convite],
  como:()=>[`A transmissão é feita pelo <strong>${CONFIG.plataforma}</strong>. Depois da inscrição, o Sympla envia por e-mail as instruções de acesso. No dia, é só entrar pelo link.`,convite],
  metodo:()=>[`O método do Daniel é <strong>O Jeito Disney, na prática</strong>: cinco frentes que se conectam para transformar cultura em experiência.<ul>
      <li><strong>Cultura:</strong> clareza sobre o padrão de experiência que a empresa quer entregar</li>
      <li><strong>Pessoas:</strong> comportamentos e atitudes que sustentam esse padrão</li>
      <li><strong>Atendimento:</strong> princípios viram comportamentos na jornada do cliente</li>
      <li><strong>Liderança:</strong> líderes preparados para sustentar a cultura no dia a dia</li>
      <li><strong>Experiência:</strong> cada contato vira uma oportunidade de criar valor</li></ul>`,convite],
  preco:()=>[`O ingresso tem valor único de <strong>${CONFIG.preco}</strong>, já com os 3 bônus: material de apoio, e-book e certificado.`,convite],
  aovivo:()=>[`A Masterclass é ao vivo, assim você acompanha os exemplos e tira dúvidas na hora com o Daniel.`,`Se o horário for um problema para você, toque em <strong>"Falar com uma pessoa"</strong> que a equipe te ajuda.`],
  oi:()=>[`Olá! 😊 Posso te contar o que você vai aprender, quem é o Daniel, a data, o valor ou já te mandar o link. O que prefere?`],
  obrigado:()=>[`Imagina! Estou por aqui se precisar de algo mais. 💜`],
  outro:()=>[`Boa pergunta! Posso te ajudar com o conteúdo, o palestrante, a data, o valor e os bônus. Se for algo mais específico, toque em <strong>"Falar com uma pessoa"</strong> que a equipe te responde no WhatsApp.`]
};

function intencao(t){
  t=t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  if(/falar com|pessoa|humano|atendente|whats|zap/.test(t))return 'pessoa';
  if(/lembre|lembrar|depois|mais tarde|aviso|avisa/.test(t))return 'lembrar';
  if(/link|quero|inscri|compr|pagar|pagamento|garantir|vaga|bora|fechado|ingresso/.test(t))return 'link';
  if(/gravad|gravacao|replay|reprise|nao posso|nao consigo|horario ruim/.test(t))return 'aovivo';
  if(/preco|valor|custa|quanto|parcel|caro|investimento/.test(t))return 'preco';
  if(/bonus|ebook|e-book|certificado|material|pdf/.test(t))return 'bonus';
  if(/para quem|publico|serve pra|serve para|meu negocio|meu segmento/.test(t))return 'paraquem';
  if(/metod|jeito disney|frentes/.test(t))return 'metodo';
  if(/quem e|daniel|palestrante|professor|apresenta|curriculo/.test(t))return 'quem';
  if(/como assist|acesso|acessar|sympla|plataforma|streaming|celular/.test(t))return 'como';
  if(/quando|data|dia|hora|horario|ao vivo|online/.test(t))return 'quando';
  if(/aprend|conteudo|ensina|sobre o que|assunto|tema|palestra/.test(t))return 'aprender';
  if(/obrigad|valeu|show|top|legal/.test(t))return 'obrigado';
  if(/^(oi|ola|bom dia|boa tarde|boa noite|e ai)\b/.test(t))return 'oi';
  return 'outro';
}
function qualPerfil(t){
  t=t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  if(/dono|empresari|socio|proprietari|meu negocio|minha empresa/.test(t))return 'dono';
  if(/lider|gerente|gestor|supervis|coorden|diretor|equipe/.test(t))return 'lider';
  if(/atend|vend|recep|linha de frente|colaborador|funcionari/.test(t))return 'atende';
  return null;
}

/* ---------- fluxo principal ---------- */
async function apresentar(p){
  perfil=p||'geral';
  await bot([...(p?PERFIS[p]:[`Na Masterclass, o Daniel Donato mostra como a Disney transforma cada atendimento em um espetáculo, e como levar esse efeito UAU para a sua empresa.`]),PROVA,OFERTA(),`Quer garantir sua vaga?`]);
  ofertaMostrada=true;opcoes();
}

async function enviarLink(){
  track('AddToCart');
  if(CONFIG.linkPagamento){
    await bot([`Ótimo! 🎉 Aqui está o seu link para garantir a vaga:`,
      `<strong>${CONFIG.titulo}</strong><br>${CONFIG.dataCurta}, ${CONFIG.horario}<br>Ingresso: <strong>${CONFIG.preco}</strong><a class="cta" href="${CONFIG.linkPagamento}" target="_blank" rel="noopener" onclick="track('InitiateCheckout')">Garantir minha vaga</a>`,
      `Depois da inscrição, o Sympla envia o acesso para o seu e-mail. Te vejo lá! ✨`]);
    opcoes();
  }else{
    await bot([`Ótimo! 🎉 As inscrições abrem em breve.`]);
    if(leadEnviado){await bot([`Já anotei seu contato, ${lead.nome}. Assim que abrir, a equipe te chama no WhatsApp.`]);opcoes();}
    else{destino='aviso';await pedirNome(`Me diz seu nome e WhatsApp que a equipe te avisa assim que abrir. Qual é o seu nome?`);}
  }
}

/* ---------- captura de contato ---------- */
async function pedirNome(texto){
  modo='nome';setInput('nome');
  await bot([texto]);
  botoes([["Agora não"]]);txt.focus();
}
async function pedirFone(){
  modo='fone';setInput('fone');
  await bot([`Prazer, ${lead.nome}! E qual é o seu WhatsApp com DDD?`]);
  botoes([["Agora não"]]);txt.focus();
}
const DDDS='11 12 13 14 15 16 17 18 19 21 22 24 27 28 31 32 33 34 35 37 38 41 42 43 44 45 46 47 48 49 51 53 54 55 61 62 63 64 65 66 67 68 69 71 73 74 75 77 79 81 82 83 84 85 86 87 88 89 91 92 93 94 95 96 97 98 99'.split(' ');
function foneOk(d){return d.length===11&&DDDS.includes(d.slice(0,2))&&d[2]==='9'&&!/^(\d)\1+$/.test(d.slice(2))}

let ficha=null;
function pegarFicha(){if(!CONFIG.leadAPI)return Promise.resolve(null);return fetch(CONFIG.leadAPI,{cache:'no-store'}).then(r=>r.json()).then(j=>{j.local=Date.now();ficha=j;return j}).catch(()=>null)}
const fichaPronta=pegarFicha();

async function registrarLead(){
  leadEnviado=true;track('Lead');
  const utm={utm_source:params.get('utm_source')||'instagram',utm_campaign:params.get('utm_campaign')||'Chat Masterclass Online '+CONFIG.dataCurta,utm_content:params.get('utm_content')||(perfil?'perfil: '+perfil:'')};
  const envios=[];
  if(CONFIG.leadAPI){
    envios.push(fichaPronta.then(f=>f||pegarFicha()).then(async f=>{
      const falta=f&&f.local?2300-(Date.now()-f.local):0;if(falta>0)await wait(falta);
      return fetch(CONFIG.leadAPI,{method:'POST',keepalive:true,headers:{'Content-Type':'application/json'},
        body:JSON.stringify({nome:lead.nome,whatsapp:lead.fone,empresa:document.getElementById('hp').value,t:f&&f.t,k:f&&f.k,...utm,teste:TESTE})});
    }).then(r=>r.json()).then(j=>{if(TESTE)add('<em>Teste: '+(j.sent?'e-mail enviado ✓':'não enviado ('+(j.motivo||'?')+')')+'</em>','bot')}).catch(e=>{if(TESTE)add('<em>Teste: falha ao conectar</em>','bot')}));
  }
  if(CONFIG.planilhaURL){
    envios.push(fetch(CONFIG.planilhaURL,{method:'POST',mode:'no-cors',keepalive:true,body:new URLSearchParams({nome:lead.nome,whatsapp:'55'+lead.fone,data:new Date().toLocaleString('pt-BR'),...utm})}));
  }
  return Promise.allSettled(envios);
}

async function concluirContato(){
  modo='chat';setInput('chat');
  registrarLead();
  const nome1=lead.nome.split(' ')[0];
  if(destino==='pessoa'){
    const link='https://wa.me/'+CONFIG.whatsapp+'?text='+encodeURIComponent(CONFIG.mensagemWhats.replace('{nome}',nome1).replace('{data}',CONFIG.dataCurta));
    await bot([`Pronto, ${nome1}! Toque no botão para falar direto com a equipe:<a class="cta" href="${link}" target="_blank" rel="noopener" onclick="track('Contact')">Abrir conversa no WhatsApp</a>`]);
  }else if(destino==='aviso'){
    await bot([`Anotado, ${nome1}! ✅ Assim que as inscrições abrirem, a equipe te chama no WhatsApp com o link.`]);
  }else{
    await bot([`Anotado, ${nome1}! ✅ A equipe vai te chamar no WhatsApp antes da Masterclass para te lembrar.`,
      CONFIG.linkPagamento?`Se quiser já garantir a vaga pelo valor de ${CONFIG.preco}, é só tocar em <strong>"Eu quero o link"</strong>.`:`Enquanto isso, fique à vontade para tirar qualquer dúvida por aqui.`]);
  }
  destino=null;opcoes();
}

/* lembrete se a pessoa ficar parada depois de ver a oferta */
function agendarLembrete(){
  clearTimeout(inativo);
  if(lembreteFeito||leadEnviado||!ofertaMostrada)return;
  inativo=setTimeout(async()=>{
    if(busy||modo!=='chat'||leadEnviado)return;
    lembreteFeito=true;
    await bot([`Ainda está por aí? 😊 Se agora não for o momento, posso pedir para a equipe te lembrar da Masterclass pelo WhatsApp.`]);
    botoes([["Sim, me lembre","main"],["Eu quero o link"],["Tenho uma dúvida"]]);
  },45000);
}

/* ---------- entrada da pessoa ---------- */
async function enviar(texto){
  if(busy||!texto.trim())return;
  clearTimeout(inativo);
  const limpo=texto.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  add(limpo,'me');await wait(350);

  if(/^agora nao$|^agora não$/i.test(texto.trim())&&(modo==='nome'||modo==='fone')){
    modo='chat';setInput('chat');destino=null;
    await bot([`Sem problema! Se mudar de ideia, estou por aqui.`]);opcoes();return;
  }
  if(modo==='nome'){
    const n=texto.trim().replace(/\s+/g,' ').slice(0,80);
    if(n.length<2||!/[a-zA-ZÀ-ú]/.test(n)){await bot([`Não entendi seu nome. Pode escrever de novo?`]);botoes([["Agora não"]]);return}
    lead.nome=n.replace(/(^|\s)\S/g,c=>c.toUpperCase());await pedirFone();return;
  }
  if(modo==='fone'){
    let d=texto.replace(/\D/g,'');if(d.length===13&&d.startsWith('55'))d=d.slice(2);
    if(!foneOk(d)){await bot([`Esse número parece incompleto. Pode enviar com DDD, assim: (85) 99999-9999?`]);botoes([["Agora não"]]);return}
    lead.fone=d;await concluirContato();return;
  }
  if(perfil===null){
    await apresentar(qualPerfil(texto));return;
  }
  const k=intencao(texto);
  if(k==='link'){await enviarLink();return}
  if(k==='pessoa'){
    if(leadEnviado){destino='pessoa';await concluirContato();return}
    destino='pessoa';await pedirNome(`Claro! Vou te passar para a equipe no WhatsApp. Antes, qual é o seu nome?`);return;
  }
  if(k==='lembrar'||/^sim, me lembre$/i.test(texto)){
    if(leadEnviado){await bot([`Seu contato já está anotado, ${lead.nome.split(' ')[0]}. A equipe vai te lembrar! 😉`]);opcoes();return}
    destino='lembrete';await pedirNome(`Combinado! Qual é o seu nome?`);return;
  }
  if(/^tenho uma duvida$|^tenho uma dúvida$/i.test(texto.trim())){await bot([`Claro! Escreva sua dúvida ou escolha um dos assuntos abaixo.`]);opcoes();return}
  vistos.add(k);
  await bot(R[k]?R[k]():R.outro());opcoes();
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const v=txt.value;txt.value='';enviar(v)});
