<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masterclass Atendimento Mágico</title>
<meta name="description" content="27ª Masterclass Atendimento Mágico! Um Case Disney, com Daniel Donato. Online e ao vivo, 26 de novembro de 2026, 19h. Ingresso R$ 47.">
<meta property="og:title" content="Masterclass Atendimento Mágico! Um Case Disney">
<meta property="og:image" content="https://masterclass-atm-case-disney.vercel.app/daniel.jpg">
<meta property="og:description" content="Online e ao vivo com Daniel Donato, 26/11 às 19h. Ingresso R$ 47 + 3 bônus.">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: uma única tela de conversa, cabeçalho fixo, mensagens rolando, atalhos + barra de digitação embaixo */
:root{
  --bg:#E9E6F0; --wall:#E3DFEC; --panel:#FFFFFF; --ink:#1F1B2E; --muted:#6C6782;
  --me:#DCD5F5; --bot:#FFFFFF; --accent:#3B2A8C; --accent-ink:#FFFFFF; --gold:#B8862B; --line:#D3CDE2;
  --display:"Fraunces", Georgia, serif; --body:"Figtree", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#110F1A; --wall:#14111F; --panel:#1C1829; --ink:#ECE9F5; --muted:#9C96B3;
  --me:#352A6B; --bot:#221D33; --accent:#A796F2; --accent-ink:#14111F; --gold:#E2B65C; --line:#2E2842; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#110F1A; --wall:#14111F; --panel:#1C1829; --ink:#ECE9F5; --muted:#9C96B3;
  --me:#352A6B; --bot:#221D33; --accent:#A796F2; --accent-ink:#14111F; --gold:#E2B65C; --line:#2E2842; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--wall);
  background-image:radial-gradient(color-mix(in srgb,var(--line) 75%,transparent) 1px,transparent 1px);background-size:18px 18px}
header{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.avatar{object-fit:cover;width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
  font-family:var(--display);font-size:13px;letter-spacing:.04em;flex:none;box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--gold)}
.who{min-width:0}
.who b{display:block;font-family:var(--display);font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:12.5px;color:var(--muted)}
.who span.on::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#2FA36B;margin-right:6px;vertical-align:1px}
#log{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.day{align-self:center;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--panel);
  padding:4px 10px;border-radius:8px;margin-bottom:6px}
.msg{max-width:86%;padding:8px 11px 6px;border-radius:10px;line-height:1.45;box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 8%,transparent);
  animation:pop .22s ease-out;overflow-wrap:anywhere}
.msg.bot{align-self:flex-start;background:var(--bot);border-top-left-radius:2px}
.msg.me{align-self:flex-end;background:var(--me);border-top-right-radius:2px}
.msg time{display:block;text-align:right;font-size:10.5px;color:var(--muted);margin-top:2px}
.msg ul{margin:6px 0 2px;padding-left:18px}
.msg li{margin:3px 0}
.msg strong{font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 2px}
.stats div{border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.stats b{display:block;font-family:var(--display);font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.1}
.stats span{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.cta{display:block;margin-top:8px;text-align:center;background:var(--accent);color:var(--accent-ink);text-decoration:none;
  font-weight:600;padding:12px 14px;border-radius:8px}
.cta:focus-visible,.chip:focus-visible,#send:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.typing{align-self:flex-start;background:var(--bot);border-radius:10px;padding:10px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
#chips{display:flex;flex-wrap:nowrap;gap:6px;padding:6px 16px 2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;mask-image:linear-gradient(90deg,#000 88%,transparent)}#chips::-webkit-scrollbar{display:none}
.chip{flex:none;white-space:nowrap;font:inherit;font-size:13px;border:1px solid var(--accent);color:var(--accent);background:var(--panel);
  padding:6px 11px;border-radius:999px;cursor:pointer}
.chip:hover{background:var(--accent);color:var(--accent-ink)}
.chip.main{background:var(--accent);color:var(--accent-ink);font-weight:600}
form{display:flex;gap:8px;padding:6px 12px calc(8px + env(safe-area-inset-bottom,0px))}
#txt{flex:1;min-width:0;font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:999px;padding:9px 14px;outline:none;font-size:16px}
#txt:focus{border-color:var(--accent)}
#send{width:42px;height:42px;flex:none;border:0;border-radius:50%;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:grid;place-items:center}
@keyframes pop{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
@media (prefers-reduced-motion:reduce){.msg,.typing i{animation:none}}
</style>

<!-- ===== META PIXEL (opcional) =====
Cole aqui o código do Pixel do Meta (Gerenciador de Eventos > Pixel > Instalar código manualmente).
A página já dispara automaticamente:
  - Lead              quando a pessoa pede o link
  - InitiateCheckout  quando ela clica em "Garantir minha vaga"
===================================== -->
</head>
<body>

<div class="app">
  <header>
    <img class="avatar" id="av" src="../daniel.jpg" alt="Daniel Donato">
    <div class="who"><b id="nm">Equipe Daniel Donato</b><span class="on" id="st">online</span></div>
  </header>
  <div id="log" aria-live="polite"><div class="day">Hoje</div></div>
  <div id="chips"></div>
  <form id="f">
    <label for="txt" hidden>Mensagem</label>
    <input id="txt" autocomplete="off" placeholder="Digite sua mensagem">
    <button id="send" aria-label="Enviar"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20.5 21 12 3 3.5l2.6 7.1L14 12l-8.4 1.4z"/></svg></button>
  </form>
</div>

<script>
/* ====== DADOS DA MASTERCLASS (edite aqui) ====== */
const CONFIG = {
  atendente: "Equipe Daniel Donato",
  titulo: "27ª Masterclass: Atendimento Mágico! Um Case Disney",
  tituloCurto: "Masterclass Atendimento Mágico",
  data: "quinta-feira, 26 de novembro de 2026",
  horario: "das 19h00 às 21h30 (horário de Brasília)",
  plataforma: "Sympla Streaming",
  preco: "R$ 47",     /* ingresso valor único */
  linkPagamento: ""   /* cole aqui o link do Sympla quando publicar */
};
/* ============================================== */

const log=document.getElementById('log'), chips=document.getElementById('chips'), st=document.getElementById('st');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const hora=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
let busy=false;const vistos=new Set();

function add(html,who){
  const d=document.createElement('div');d.className='msg '+who;
  d.innerHTML=html+'<time>'+hora()+'</time>';log.appendChild(d);log.scrollTop=log.scrollHeight;
}
async function bot(list){
  busy=true;chips.innerHTML='';
  for(const html of list){
    const t=document.createElement('div');t.className='typing';t.innerHTML='<i></i><i></i><i></i>';
    log.appendChild(t);log.scrollTop=log.scrollHeight;st.textContent='digitando…';st.className='';
    await wait(Math.min(2300,700+html.replace(/<[^>]+>/g,'').length*13));
    t.remove();add(html,'bot');await wait(380);
  }
  st.textContent='online';st.className='on';busy=false;
}
const OPCOES=[["O que vou aprender?","aprender"],["Quem é o Daniel?","quem"],["Quanto custa?","preco"],["Data e horário","quando"],["Quais os bônus?","bonus"],["Para quem é?","paraquem"],["Como assisto?","como"]];
function opcoes(){
  chips.innerHTML='';
  const q=document.createElement('button');q.className='chip main';q.textContent='Eu quero o link';q.onclick=()=>enviar('Eu quero o link');chips.appendChild(q);
  OPCOES.filter(([,k])=>!vistos.has(k)).forEach(([t])=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>enviar(t);chips.appendChild(b)});
}
const convite=`Quer garantir sua vaga? É só me dizer <strong>"eu quero o link"</strong>.`;

const R={
  aprender:()=>[
    `Na Disney, cada contato com o cliente é tratado como parte de um <strong>espetáculo</strong>. Na Masterclass, o Daniel traduz esse jeito de pensar para a realidade da sua empresa. Você vai aprender:<ul>
      <li>Por que cada contato com o cliente é um "espetáculo" e como preparar a equipe para ele</li>
      <li>Os padrões de atendimento que a Disney usa para encantar em escala</li>
      <li>Como transformar clientes satisfeitos em clientes fiéis e promotores da marca</li>
      <li>Atitudes simples que criam o efeito UAU no dia a dia da sua empresa</li></ul>`,
    `Tudo com exemplos vividos em mais de 20 visitas técnicas aos parques e lojas da Disney, para você sair com atitudes práticas para aplicar no dia seguinte. ✨`],
  quem:()=>[
    `O <strong>Daniel Donato</strong> é palestrante e consultor especialista em Experiência do Cliente, Cultura Disney e Desenvolvimento de Pessoas.
     <div class="stats"><div><b>+20</b><span>visitas técnicas à Disney</span></div><div><b>+50 mil</b><span>profissionais transformados</span></div>
     <div><b>20 anos</b><span>de consultoria</span></div><div><b>10 anos</b><span>no palco</span></div></div>`,
    `Ele tem certificação em Guestologia Business pelo Seeds of Dreams Institute e fez os programas Backstage Magic e Keys to the Kingdom pelo Disney Institute. É formado em Administração, com MBA em Marketing Estratégico e Marketing de Relacionamento, e é autor do livro <strong>"Checklist Cliente Feliz: Atendimento de Alto Impacto"</strong>.`],
  quando:()=>[`A Masterclass acontece na <strong>${CONFIG.data}</strong>, <strong>${CONFIG.horario}</strong>.`,
    `É uma edição <strong>online e ao vivo</strong>, então você assiste de onde estiver. ${convite}`],
  paraquem:()=>[`É para todo mundo que tem contato com cliente ou lidera quem tem:<ul>
      <li>Diretores, gerentes e supervisores</li><li>Equipes de atendimento e vendas</li><li>Colaboradores em geral</li></ul>`,
    `O conteúdo serve para varejo, saúde, serviços e indústria. Vale muito trazer a equipe junto! 😉`],
  bonus:()=>[`Quem participa leva 3 bônus exclusivos 🎁<ul>
      <li>Material de apoio em PDF</li><li>E-book <strong>Além dos Bastidores</strong></li><li>Certificado virtual de participação</li></ul>`,convite],
  como:()=>[`A transmissão é feita por videoconferência no <strong>${CONFIG.plataforma}</strong>.`,
    `Depois da inscrição, você recebe por e-mail as instruções de acesso. No dia, é só entrar pelo link e assistir pelo computador ou celular.`],
  metodo:()=>[`O método do Daniel é <strong>O Jeito Disney, na prática</strong>: cinco frentes que se conectam para transformar cultura em experiência.<ul>
      <li><strong>Cultura:</strong> clareza sobre o padrão de experiência que a empresa quer entregar</li>
      <li><strong>Pessoas:</strong> comportamentos e atitudes que sustentam esse padrão</li>
      <li><strong>Atendimento:</strong> princípios viram comportamentos na jornada do cliente</li>
      <li><strong>Liderança:</strong> líderes preparados para sustentar a cultura no dia a dia</li>
      <li><strong>Experiência:</strong> cada contato vira uma oportunidade de criar valor</li></ul>`],
  preco:()=>CONFIG.preco
    ?[`O ingresso tem valor único de <strong>${CONFIG.preco}</strong>, e você ainda leva os 3 bônus: material de apoio em PDF, o e-book Além dos Bastidores e o certificado de participação. 🎁`,convite]
    :[`O valor e as formas de pagamento aparecem na página de inscrição do Sympla.`,`Quer que eu te envie o link?`],
  link:()=>{try{window.fbq&&fbq('track','Lead')}catch(e){};return CONFIG.linkPagamento
    ?[`Que ótimo! 🎉 Aqui está o seu link para garantir a vaga na <strong>${CONFIG.titulo}</strong>:`,
      `<strong>${CONFIG.data}</strong>, ${CONFIG.horario}${CONFIG.preco?'<br>Investimento: <strong>'+CONFIG.preco+'</strong>':''}<a class="cta" href="${CONFIG.linkPagamento}" target="_blank" rel="noopener" onclick="try{window.fbq&&fbq('track','InitiateCheckout')}catch(e){}">Garantir minha vaga</a>`,
      `Assim que a inscrição for confirmada, o Sympla envia o acesso para o seu e-mail. Te vejo lá! ✨`]
    :[`Que ótimo! 🎉 As inscrições abrem em breve e o link ainda não está disponível.`,`Volte aqui nos próximos dias que eu te passo o link na hora.`]},
  oi:()=>[`Olá! Tudo bem? Posso te contar o que você vai aprender, quem é o Daniel, a data, os bônus ou já te mandar o link. O que prefere?`],
  obrigado:()=>[`Imagina! Estou por aqui se precisar de algo mais. 💜`],
  outro:()=>[`Boa pergunta! Posso te ajudar com o conteúdo, o palestrante, a data, o valor, os bônus, como assistir ou já te enviar o link de inscrição. É só escolher uma opção abaixo 👇`]
};
function intencao(t){
  t=t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  if(/link|quero|inscri|compr|pagar|pagamento|garantir|vaga|bora|fechado|ingresso/.test(t))return 'link';
  if(/preco|valor|custa|quanto|parcel|caro|investimento/.test(t))return 'preco';
  if(/bonus|ebook|e-book|certificado|material|pdf/.test(t))return 'bonus';
  if(/para quem|publico|serve pra|serve para|equipe|gerente|vendedor/.test(t))return 'paraquem';
  if(/metod|jeito disney|frentes/.test(t))return 'metodo';
  if(/quem|daniel|palestrante|professor|apresenta|curriculo/.test(t))return 'quem';
  if(/como assist|acesso|acessar|sympla|plataforma|streaming|gravad|celular/.test(t))return 'como';
  if(/quando|data|dia|hora|horario|ao vivo|online/.test(t))return 'quando';
  if(/aprend|conteudo|ensina|sobre o que|assunto|tema|palestra/.test(t))return 'aprender';
  if(/obrigad|valeu|show|top|legal/.test(t))return 'obrigado';
  if(/^(oi|ola|bom dia|boa tarde|boa noite|e ai)\b/.test(t))return 'oi';
  return 'outro';
}
async function enviar(texto){
  if(busy||!texto.trim())return;
  add(texto.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])),'me');
  const k=intencao(texto);vistos.add(k);await wait(400);await bot(R[k]());opcoes();chips.scrollLeft=0;
}
document.getElementById('f').addEventListener('submit',e=>{
  e.preventDefault();const i=document.getElementById('txt');const v=i.value;i.value='';enviar(v);
});

(async()=>{
  await wait(600);
  add('Gostaria de saber mais sobre a Masterclass','me');
  await wait(500);
  await bot([
    `Olá! Tudo bem? 👋 Que bom que você chegou até aqui!`,
    `A <strong>${CONFIG.titulo}</strong> é uma edição online e ao vivo com o <strong>Daniel Donato</strong>, na ${CONFIG.data}, ${CONFIG.horario}.`,
    `Você vai descobrir como a Disney transforma cada atendimento em um espetáculo e como levar esse efeito UAU para a sua empresa. O que você quer saber primeiro?`
  ]);
  opcoes();
})();
</script>

</body>
</html>
